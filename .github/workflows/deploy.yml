name: Deploy WrapFit to VPS

# Runs only after CI passed on main (or by hand). The VPS rebuilds the images and serves HTTPS through Caddy
# (docker-compose.prod.yml); see be/README.md, section "Triển khai production".
on:
  workflow_dispatch:
  workflow_run:
    workflows: [WrapFit CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'WrapFit/WrapFit' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Check VPS Secrets Configured
        id: check_secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "::warning title=VPS Secrets Missing::VPS_HOST secret is not configured in GitHub repository settings. Skipping SSH deployment until VPS credentials are provided."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Execute deployment commands via SSH
        if: steps.check_secrets.outputs.configured == 'true'
        # Pinned to the commit of v1.0.3: this step holds the SSH key of the VPS, a moved tag must not change its code.
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd ~/WrapFit
            bash be/deploy.sh
